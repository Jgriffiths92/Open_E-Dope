name: Build Open E-Dope APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config git zip unzip cmake libffi-dev libssl-dev libncurses-dev zlib1g-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer
      run: pip install --upgrade Cython==0.29.36 virtualenv buildozer

    - name: Compile APK
      run: |
        for attempt in 1 2 3; do
          if yes | buildozer -v android debug; then
            exit 0
          fi
          echo "Build attempt $attempt failed (possibly a transient download error); retrying..."
          sleep 30
        done
        exit 1

    - name: Upload Output Artifact
      uses: actions/upload-artifact@v4
      with:
        name: open-edope-debug-apk
        path: bin/*.apk
