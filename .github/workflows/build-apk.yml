name: Build Open E-Dope APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config git zip unzip cmake libffi-dev libssl-dev libncurses-dev zlib1g-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer
      run: pip install --upgrade Cython==0.29.36 virtualenv buildozer

    - name: Pin python-for-android
      # current p4a master breaks the build (pip/venv handling); use the last known-good commit
      run: |
        sed -i 's/^#\?p4a.commit *=.*/p4a.commit = 2473ddeabb286b826924c49e62ea6c42a9acfd7a/' buildozer.spec
        grep -n '^p4a\.\(branch\|commit\)' buildozer.spec

    - name: Compile APK
      run: yes | buildozer -v android debug

    - name: Upload Output Artifact
      uses: actions/upload-artifact@v4
      with:
        name: open-edope-debug-apk
        path: bin/*.apk
